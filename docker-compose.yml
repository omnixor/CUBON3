services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - cubon3_data:/app/backend/generated
      - cubon3_db:/app/backend/data
      - cubon3_dicom:/app/backend/dicom_data
    environment:
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      CUBON3_DB_PATH: "/app/backend/data/cubon3.db"

volumes:
  cubon3_data:
  cubon3_db:
  cubon3_dicom:
